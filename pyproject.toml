[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepcobot-camera-line-follower"
version = "1.0.0"
description = "Reconstructed camera-based path perception and steering control for a DeepCobot robotics project."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["control*", "simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
